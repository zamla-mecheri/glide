<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger - AutoConnect</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    
    <header class="bg-yellow-400 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-gray-800 hover:text-gray-600"><i class="fa-solid fa-rickshaw"></i> AutoConnect</a>
            <div class="flex items-center gap-2">
                <a href="index.html" class="text-sm text-gray-700 hover:underline">Home</a>
                <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm hidden" id="logoutBtn">Logout</button>
            </div>
        </div>
    </header>

    <div id="loginSection" class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center">Passenger Login</h2>
        <div class="space-y-4">
            <input id="loginPhone" type="tel" placeholder="Phone Number" class="w-full p-3 border rounded-lg">
            <input id="loginPassword" type="password" placeholder="Password" class="w-full p-3 border rounded-lg">
            <button onclick="loginPassenger()" class="w-full bg-yellow-400 font-bold py-3 rounded-lg hover:bg-yellow-500">Login</button>
            <button onclick="showRegister()" class="w-full bg-gray-200 font-bold py-3 rounded-lg hover:bg-gray-300">New User? Register</button>
        </div>
    </div>

    <div id="registerSection" class="hidden max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-center">Passenger Registration</h2>
        <div class="space-y-4">
            <input id="regName" type="text" placeholder="Full Name" class="w-full p-3 border rounded-lg">
            <input id="regPhone" type="tel" placeholder="Phone Number" class="w-full p-3 border rounded-lg">
            <input id="regPassword" type="password" placeholder="Password" class="w-full p-3 border rounded-lg">
            <input id="regEmail" type="email" placeholder="Email (Optional)" class="w-full p-3 border rounded-lg">
            <input id="regEmergency" type="tel" placeholder="Emergency Contact" class="w-full p-3 border rounded-lg">
            <button onclick="registerPassenger()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">Register</button>
            <button onclick="showLogin()" class="w-full bg-gray-200 font-bold py-3 rounded-lg hover:bg-gray-300">Back to Login</button>
        </div>
    </div>

    <div id="dashboardSection" class="hidden max-w-4xl mx-auto p-4 space-y-6">
        
        <section class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-2">Welcome, <span id="userName">User</span>! 👋</h2>
            <p class="text-gray-600">Find your ride quickly and safely</p>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-bold mb-4"><i class="fa-solid fa-map-marker-alt mr-2 text-red-500"></i> Book a Ride</h2>
            <div class="space-y-4">
                <input id="pickup" type="text" placeholder="Pickup Location" class="w-full p-3 border rounded-lg">
                <input id="destination" type="text" placeholder="Destination" class="w-full p-3 border rounded-lg">
                <input id="distance" type="number" placeholder="Distance (km)" class="w-full p-3 border rounded-lg">
                <div id="fareResult" class="hidden p-3 bg-green-50 border rounded-lg text-center">
                    <p class="text-gray-600">Estimated Fare (Govt rate): <span id="fareAmount" class="text-xl font-bold text-green-700">₹0</span></p>
                </div>
                <button onclick="calculateFare()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">Calculate Fare</button>
            </div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-bold mb-4"><i class="fa-solid fa-users mr-2 text-green-500"></i> Available Drivers</h2>
            <div id="driversList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">Loading...</p>
            </div>
        </section>

        <section class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-lg font-bold mb-4"><i class="fa-solid fa-clock mr-2 text-blue-500"></i> My Bookings</h2>
            <div id="bookingsList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">No bookings yet</p>
            </div>
        </section>

        <section class="bg-red-50 p-6 rounded-2xl border border-red-200">
            <h3 class="text-red-700 font-bold mb-4"><i class="fa-solid fa-shield-alt mr-2"></i> Safety First</h3>
            <div class="grid grid-cols-2 gap-3">
                <a href="tel:100" class="bg-red-600 text-white text-center py-3 rounded-lg font-bold">Call 100</a>
                <button onclick="shareLocation()" class="bg-gray-800 text-white py-3 rounded-lg font-bold">Share Trip</button>
                <button onclick="showComplaintModal()" class="bg-orange-600 text-white py-3 rounded-lg font-bold">Complaint</button>
                <button onclick="showEmergencyContacts()" class="bg-purple-600 text-white py-3 rounded-lg font-bold">Contacts</button>
            </div>
        </section>

    </div>

    <div id="complaintModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">File a Complaint</h3>
            <select id="complaintType" class="w-full p-3 border rounded-lg mb-3">
                <option value="">Select Type</option>
                <option value="fare">Fare Issue</option>
                <option value="behavior">Driver Behavior</option>
                <option value="safety">Safety Concern</option>
                <option value="other">Other</option>
            </select>
            <textarea id="complaintDesc" placeholder="Describe..." class="w-full p-3 border rounded-lg mb-3" rows="4"></textarea>
            <div class="flex gap-2">
                <button onclick="submitComplaint()" class="flex-1 bg-red-600 text-white py-2 rounded-lg font-bold">Submit</button>
                <button onclick="closeComplaintModal()" class="flex-1 bg-gray-300 py-2 rounded-lg font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <div id="reviewModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">Rate Your Driver</h3>
            <p class="mb-3">Driver: <span id="reviewDriverName" class="font-bold"></span></p>
            <div class="flex justify-center gap-2 mb-4">
                <button onclick="setRating(1)" class="text-3xl star-btn">⭐</button>
                <button onclick="setRating(2)" class="text-3xl star-btn">⭐</button>
                <button onclick="setRating(3)" class="text-3xl star-btn">⭐</button>
                <button onclick="setRating(4)" class="text-3xl star-btn">⭐</button>
                <button onclick="setRating(5)" class="text-3xl star-btn">⭐</button>
            </div>
            <textarea id="reviewComment" placeholder="Share your experience..." class="w-full p-3 border rounded-lg mb-3" rows="3"></textarea>
            <div class="flex gap-2">
                <button onclick="submitReview()" class="flex-1 bg-yellow-400 py-2 rounded-lg font-bold">Submit</button>
                <button onclick="closeReviewModal()" class="flex-1 bg-gray-300 py-2 rounded-lg font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        let currentPassenger = null;
        let selectedRating = 0;
        let currentReviewDriverId = null;

        function showLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
        }

        async function registerPassenger() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;
            const email = document.getElementById('regEmail').value;
            const emergency = document.getElementById('regEmergency').value;
            if (!name || !phone || !password) { alert('Fill required fields'); return; }
            try {
                await AutoAPI.registerPassenger({ name, phone, password, email, emergencyContact: emergency });
                alert('Registration successful!');
                showLogin();
            } catch (e) {
                alert(e.message || 'Registration failed');
            }
        }

        async function loginPassenger() {
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            if (!phone || !password) { alert('Enter phone and password'); return; }
            try {
                const passenger = await AutoAPI.loginPassenger(phone, password);
                currentPassenger = passenger;
                sessionStorage.setItem('currentPassenger', JSON.stringify(passenger));
                loadDashboard();
                showDashboard();
            } catch (e) {
                alert(e.message || 'Invalid credentials');
            }
        }

        function loadDashboard() {
            document.getElementById('userName').textContent = currentPassenger.name;
            loadDrivers();
            loadBookings();
        }

        function calculateFare() {
            const distance = parseFloat(document.getElementById('distance').value);
            if (!distance || distance <= 0) { alert('Enter valid distance'); return; }
            let fare = distance <= 1.5 ? 30 : 30 + (distance - 1.5) * 15;
            document.getElementById('fareAmount').textContent = '₹' + fare.toFixed(2);
            document.getElementById('fareResult').classList.remove('hidden');
        }

        async function loadDrivers() {
            const list = document.getElementById('driversList');
            try {
                const drivers = await AutoAPI.getDrivers(true);
                if (!drivers.length) {
                    list.innerHTML = '<p class="text-gray-500 text-center py-4">No drivers available. Drivers must be online to appear here.</p>';
                    return;
                }
                const reviews = await AutoAPI.getReviewsAll();
                list.innerHTML = drivers.map(driver => {
                    const driverReviews = reviews.filter(r => r.driverId === driver.id);
                    const avgRating = driverReviews.length ? (driverReviews.reduce((s, r) => s + r.rating, 0) / driverReviews.length).toFixed(1) : (driver.rating || 5.0);
                    const autoNum = driver.autoNumber || driver.auto || '-';
                    return `<div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border-l-4 border-yellow-400">
                        <div class="flex-1">
                            <p class="font-bold">${driver.name}</p>
                            <p class="text-xs text-gray-500">${autoNum} • ${avgRating} ⭐</p>
                            <p class="text-sm text-green-600">Available Now</p>
                        </div>
                        <div class="flex gap-2">
                            <a href="tel:${driver.phone}" class="bg-green-500 text-white p-3 rounded-full"><i class="fa-solid fa-phone"></i></a>
                            <button onclick="requestRide('${driver.id}')" class="bg-yellow-400 px-4 py-2 rounded-lg font-bold">Request</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center py-4">${e.message}. Ensure backend is running at same origin.</p>`;
            }
        }

        async function requestRide(driverId) {
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            const distance = document.getElementById('distance').value;
            if (!pickup || !destination || !distance) { alert('Fill all booking details first'); return; }
            const fare = parseFloat(document.getElementById('fareAmount').textContent.replace('₹', ''));
            if (!fare) { alert('Calculate fare first'); return; }
            const drivers = await AutoAPI.getDrivers(true);
            const driver = drivers.find(d => d.id === driverId);
            if (!driver) { alert('Driver not found'); return; }
            try {
                await AutoAPI.createRequest({
                    passengerId: currentPassenger.id, passengerName: currentPassenger.name, passengerPhone: currentPassenger.phone,
                    driverId, pickup, destination, distance: parseFloat(distance), fare
                });
                alert('Request sent to ' + driver.name + '!');
                loadBookings();
            } catch (e) {
                alert(e.message || 'Request failed');
            }
        }

        async function loadBookings() {
            const list = document.getElementById('bookingsList');
            try {
                const requests = await AutoAPI.getRequests({ passengerId: currentPassenger.id });
                const myBookings = requests.filter(r => r.passengerId === currentPassenger.id);
                if (!myBookings.length) {
                    list.innerHTML = '<p class="text-gray-500 text-center py-4">No bookings yet</p>';
                    return;
                }
                const statusColors = { pending: 'gray', accepted: 'green', rejected: 'red', completed: 'blue' };
                list.innerHTML = myBookings.map(booking => {
                    const color = statusColors[booking.status] || 'gray';
                    const driverName = (booking.driverName || '').replace(/'/g, "\\'");
                    return `<div class="bg-gray-50 p-4 rounded-lg border">
                        <div class="flex justify-between mb-2">
                            <div><p class="font-bold">${booking.driverName}</p><p class="text-sm text-gray-600">${booking.pickup} → ${booking.destination}</p></div>
                            <span class="bg-${color}-100 text-${color}-700 px-3 py-1 rounded-full text-xs font-bold">${booking.status.toUpperCase()}</span>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <span class="text-lg font-bold text-green-700">₹${booking.fare}</span>
                            ${booking.status === 'accepted' ? `<button onclick="completeRide('${booking.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Complete & Review</button>` : ''}
                            ${booking.status === 'completed' ? `<button onclick="openReviewModal('${booking.driverId}','${driverName}')" class="bg-yellow-400 px-4 py-2 rounded-lg text-sm font-bold">Rate Driver</button>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center py-4">${e.message}</p>`;
            }
        }

        async function completeRide(id) {
            try {
                await AutoAPI.updateRequest(id, 'completed');
                const requests = await AutoAPI.getRequests({ passengerId: currentPassenger.id });
                const r = requests.find(x => x.id === id);
                if (r) openReviewModal(r.driverId, r.driverName);
                loadBookings();
            } catch (e) {
                alert(e.message || 'Failed');
            }
        }

        function shareLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    alert(`Location shared!\nLat: ${pos.coords.latitude.toFixed(4)}\nLng: ${pos.coords.longitude.toFixed(4)}\nSent to: ${currentPassenger.emergencyContact || 'No emergency contact set'}`);
                }, () => alert('Unable to get location'));
            }
        }

        function showComplaintModal() { document.getElementById('complaintModal').classList.remove('hidden'); }
        function closeComplaintModal() { document.getElementById('complaintModal').classList.add('hidden'); }

        async function submitComplaint() {
            const type = document.getElementById('complaintType').value;
            const desc = document.getElementById('complaintDesc').value;
            if (!type || !desc) { alert('Fill all fields'); return; }
            try {
                await AutoAPI.createComplaint({ passengerId: currentPassenger.id, passengerName: currentPassenger.name, type, description: desc });
                alert('Complaint submitted!');
                closeComplaintModal();
            } catch (e) {
                alert(e.message || 'Failed');
            }
        }

        function openReviewModal(driverId, driverName) {
            currentReviewDriverId = driverId;
            document.getElementById('reviewDriverName').textContent = driverName;
            document.getElementById('reviewModal').classList.remove('hidden');
            selectedRating = 0;
            document.querySelectorAll('.star-btn').forEach((s, i) => { s.style.opacity = '0.3'; });
        }

        function closeReviewModal() { document.getElementById('reviewModal').classList.add('hidden'); }

        function setRating(rating) {
            selectedRating = rating;
            document.querySelectorAll('.star-btn').forEach((s, i) => { s.style.opacity = i < rating ? '1' : '0.3'; });
        }

        async function submitReview() {
            if (!selectedRating) { alert('Select rating'); return; }
            const comment = document.getElementById('reviewComment').value || 'No comment';
            try {
                await AutoAPI.createReview({
                    driverId: currentReviewDriverId, passengerId: currentPassenger.id, passengerName: currentPassenger.name,
                    rating: selectedRating, comment
                });
                alert('Thank you for your review!');
                closeReviewModal();
                loadDrivers();
            } catch (e) {
                alert(e.message || 'Failed');
            }
        }

        function showEmergencyContacts() {
            alert(`Emergency Contacts:\n\nYour Contact: ${currentPassenger.emergencyContact || 'Not set'}\n\nPolice: 100\nAmbulance: 108\nWomen Helpline: 1091`);
        }

        function logout() {
            if (confirm('Logout?')) {
                currentPassenger = null;
                sessionStorage.removeItem('currentPassenger');
                showLogin();
            }
        }

        window.onload = function() {
            const saved = sessionStorage.getItem('currentPassenger');
            if (saved) {
                currentPassenger = JSON.parse(saved);
                loadDashboard();
                showDashboard();
            }
        };
    </script>
</body>
</html>
